# Staging-only configuration. Order intake remains disabled until live security and E2E approval.
name = "alasas-floor-orders-staging"
main = "src/order-worker-entry.js"
compatibility_date = "2026-10-14"

[vars]
ORDERS_ENABLED = "false"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
FIREBASE_PROJECT_ID = "floor-232bc-staging"
FIREBASE_SHOP_ID = "floor-232bc"
GIFTING_RATE_LIMITER_REQUIRED = "true"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "74016"

[ratelimits.simple]
limit = 60
period = 60

[[d1_databases]]
binding = "DB"
database_name = "alasas-floor-orders-staging"
database_id = "c45335a4-be16-4c8d-aded-2a2ce33836f0"
migrations_dir = "migrations"

# Configure outside Git, only after a separate Firebase Staging RTDB exists (Blaze approval required):
# FIREBASE_DATABASE_URL
# FIREBASE_SERVICE_ACCOUNT_EMAIL
# FIREBASE_SERVICE_ACCOUNT_PRIVATE_KEY
# RATE_LIMITER binding
